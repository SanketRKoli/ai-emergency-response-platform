name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 26]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: Frontend build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 26]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
